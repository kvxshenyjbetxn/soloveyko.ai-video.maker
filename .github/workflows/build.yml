name: Wails Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Дозволяє запускати збірку вручну кнопкою

env:
  # Necessary for most environments (https://github.com/wailsapp/wails/issues/1402)
  GO111MODULE: on

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14] # macos-14 — це стабільний M1-раннер

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: |
          # Збираємо для ARM64 (твій M-процесор)
          wails build -platform darwin/arm64 -o Soloveyko -clean

      # --- Mac Specific ---
      - name: Prepare, Sign and Zip
        if: matrix.os == 'macos-14'
        run: |
          cd build/bin
          # Очищаємо аттрибути
          xattr -cr Soloveyko.app
          
          # Надаємо права на запуск
          chmod +x Soloveyko.app/Contents/MacOS/Soloveyko
          
          # Підписуємо (критично для M1/M2/M3)
          codesign --force --sign - Soloveyko.app/Contents/MacOS/Soloveyko
          codesign --force --sign - Soloveyko.app
          
          # Створюємо ZIP за допомогою ditto (це стандарт Mac)
          ditto -c -k --sequesterRsrc Soloveyko.app Soloveyko-macOS.zip

      # --- Upload Artifacts ---
      
      - name: Upload Mac Artifact
        if: matrix.os == 'macos-14'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-macOS
          path: build/bin/Soloveyko-macOS.zip

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-Linux
          path: build/bin/Soloveyko-Linux-amd64
