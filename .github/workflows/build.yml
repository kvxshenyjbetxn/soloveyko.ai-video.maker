name: Wails Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  # Necessary for most environments (https://github.com/wailsapp/wails/issues/1402)
  GO111MODULE: on

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: |
          # Збираємо саме для ARM64 (M1/M2/M3)
          wails build -platform darwin/arm64 -o Soloveyko-macOS

      # --- Mac Specific ---
      - name: Code Sign and Zip
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          # Надаємо права на запуск
          chmod +x Soloveyko-macOS.app/Contents/MacOS/*
          # Примусово підписуємо "ad-hoc" підписом (це критично для M-процесорів)
          codesign --force --deep --sign - Soloveyko-macOS.app
          # Пакуємо за допомогою ditto (краще за zip для Mac)
          ditto -c -k --sequesterRsrc Soloveyko-macOS.app Soloveyko-macOS.zip

      # --- Upload Artifacts ---
      
      - name: Upload Mac Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-macOS
          path: build/bin/Soloveyko-macOS.zip

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-Linux
          path: build/bin/Soloveyko-Linux-amd64
