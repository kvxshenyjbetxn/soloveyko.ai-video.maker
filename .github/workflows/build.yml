name: Wails Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  # Necessary for most environments (https://github.com/wailsapp/wails/issues/1402)
  GO111MODULE: on

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: |
          # Робимо універсальну збірку (Intel + Apple Silicon)
          wails build -platform darwin/universal

      # --- Mac Specific ---
      - name: Package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          # 1. Надаємо правильну назву додатку
          mv soloveyko.app "Soloveyko.app"
          
          # 2. Виправляємо права та прибираємо мітки карантину раннера
          chmod -R +x "Soloveyko.app/Contents/MacOS/"
          xattr -rc "Soloveyko.app"
          
          # 3. Підписуємо (ad-hoc), щоб M-процесори не блокували програму
          codesign --force --deep --sign - "Soloveyko.app"
          
          # 4. Створюємо DMG образ (це стандарт для Mac)
          hdiutil create -volname "Soloveyko AI" -srcfolder "Soloveyko.app" -ov -format UDZO Soloveyko.dmg

      # --- Upload Artifacts ---
      
      - name: Upload Mac Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-macOS
          path: build/bin/Soloveyko.dmg

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-Linux
          path: build/bin/Soloveyko-Linux-amd64
