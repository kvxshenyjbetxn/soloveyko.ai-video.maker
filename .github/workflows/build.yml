name: Wails Build macOS

on:
  workflow_dispatch: # Дозволяє запускати вручну

jobs:
  build:
    name: Build for macOS (Universal)
    runs-on: macos-14 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Universal Binary
        run: wails build -platform darwin/universal -clean

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - build/bin/Soloveyko.AI.Video.Maker.app

      - name: Create correct .zip archive
        run: |
          cd build/bin
          zip -r ../${{ github.event.repository.name }}-macos-universal.zip *.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-app
          path: build/*.zip
