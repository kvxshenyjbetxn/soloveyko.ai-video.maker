name: Wails Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

env:
  # Necessary for most environments (https://github.com/wailsapp/wails/issues/1402)
  GO111MODULE: on

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        run: |
          wails build

      # --- Mac Specific ---
      # For Mac, we want to upload the .app bundle (zipped)
      - name: Rename Mac App
        if: matrix.os == 'macos-latest'
        run: mv build/bin/soloveyko.app build/bin/Soloveyko-macOS.app

      - name: Zip Mac App
        if: matrix.os == 'macos-latest'
        run: |
          cd build/bin
          zip -r Soloveyko-macOS.zip Soloveyko-macOS.app

      # --- Upload Artifacts ---
      
      - name: Upload Mac Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-macOS
          path: build/bin/Soloveyko-macOS.zip

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Soloveyko-Linux
          path: build/bin/Soloveyko-Linux-amd64
