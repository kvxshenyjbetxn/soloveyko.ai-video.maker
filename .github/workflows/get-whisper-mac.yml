name: Build Whisper for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        run: git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git

      - name: Build Whisper (Static)
        run: |
          cd whisper.cpp
          # Вимикаємо динамічні бібліотеки (-DBUILD_SHARED_LIBS=OFF)
          # Вмикаємо Metal для швидкості на Маках (-DWHISPER_METAL=ON)
          cmake -B build \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_METAL=ON
          
          cmake --build build --config Release -j 4

      - name: Prepare Artifact
        run: |
          # В CMake бінарники зазвичай копіюються в build/bin/
          if [ -f whisper.cpp/build/bin/whisper-cli ]; then
            cp whisper.cpp/build/bin/whisper-cli whisper
          elif [ -f whisper.cpp/build/bin/main ]; then
            cp whisper.cpp/build/bin/main whisper
          else
            echo "Шукаємо глибше..."
            find whisper.cpp/build -type f -perm +111 \( -name "whisper-cli" -o -name "main" \) -exec cp {} whisper \;
          fi
          
          if [ ! -f whisper ]; then
             echo "Помилка: Бінарник не знайдено!"
             exit 1
          fi
          
          chmod +x whisper
          echo "Розмір отриманого файлу:"
          ls -lh whisper

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-mac-only
          path: whisper
