name: Build Whisper for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        run: git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git

      - name: Setup CMake
        run: brew install cmake

      - name: Build Whisper
        run: |
          cd whisper.cpp
          cmake -B build -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build --config Release -j 4

      - name: Prepare Artifact
        run: |
          # В CMake бінарники лежать у папці build/bin/
          if [ -f whisper.cpp/build/bin/whisper-cli ]; then
            mv whisper.cpp/build/bin/whisper-cli whisper
          elif [ -f whisper.cpp/build/bin/main ]; then
            mv whisper.cpp/build/bin/main whisper
          else
            echo "Помилка: Бінарник не знайдено!"
            find whisper.cpp/build -name "whisper-cli" -o -name "main"
            exit 1
          fi
          chmod +x whisper

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-mac-only
          path: whisper
