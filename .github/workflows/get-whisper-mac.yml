name: Build Whisper for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        run: git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git

      - name: Build Whisper (Static)
        run: |
          cd whisper.cpp
          # Компілюємо
          make -j
          
      - name: Prepare Artifact
        run: |
          # Шукаємо бінарник за допомогою find, щоб не гадати з назвою
          # Нам потрібен або 'whisper-cli' або 'main' який є виконуваним файлом
          FOUND_BIN=$(find whisper.cpp -type f -perm +111 \( -name "whisper-cli" -o -name "main" \) | head -n 1)
          
          if [ -n "$FOUND_BIN" ]; then
            echo "Знайдено бінарник: $FOUND_BIN"
            cp "$FOUND_BIN" whisper
          else
            echo "Помилка: Бінарник не знайдено! Список файлів у whisper.cpp:"
            ls -R whisper.cpp
            exit 1
          fi
          chmod +x whisper

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-mac-only
          path: whisper
