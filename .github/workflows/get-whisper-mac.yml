name: Build Whisper for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        run: git clone https://github.com/ggerganov/whisper.cpp.git

      - name: Build Whisper
        run: |
          cd whisper.cpp
          # Компілюємо основний клієнт. В нових версіях він може називатися whisper-cli або main
          make whisper-cli || make main || make

      - name: Prepare Artifact
        run: |
          # Шукаємо бінарник (він може бути або main, або whisper-cli)
          if [ -f whisper.cpp/whisper-cli ]; then
            mv whisper.cpp/whisper-cli whisper
          elif [ -f whisper.cpp/main ]; then
            mv whisper.cpp/main whisper
          else
            echo "Помилка: Бінарник не знайдено в папці whisper.cpp"
            ls -R whisper.cpp
            exit 1
          fi
          chmod +x whisper

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-mac-only
          path: whisper
