name: Build Whisper for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout whisper.cpp
        run: git clone --depth 1 https://github.com/ggerganov/whisper.cpp.git

      - name: Build Whisper (Static)
        run: |
          cd whisper.cpp
          # Використовуємо make для створення статичного бінарника, який не потребує .dylib
          make whisper-cli || make main || make
          
      - name: Prepare Artifact
        run: |
          # Шукаємо бінарник у корені папки або в examples
          if [ -f whisper.cpp/whisper-cli ]; then
            mv whisper.cpp/whisper-cli whisper
          elif [ -f whisper.cpp/main ]; then
            mv whisper.cpp/main whisper
          elif [ -f whisper.cpp/examples/main/main ]; then
            mv whisper.cpp/examples/main/main whisper
          else
            echo "Помилка: Бінарник не знайдено!"
            ls -R whisper.cpp
            exit 1
          fi
          chmod +x whisper

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-mac-only
          path: whisper
